plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

group = mod_group_id
version = mod_version

base {
    archivesName = 'minecraft-community'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
}

sourceSets.main.resources {
    srcDir('DragonAPI/Resources')
    srcDir('RotaryCraft/Resources')
    srcDir('src/generated/resources')
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'dragonapi,rotarycraft'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'dragonapi,rotarycraft'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'dragonapi,rotarycraft'
        }
        data {
            clientData()
            programArguments.addAll '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        dragonapi {
            sourceSet(sourceSets.main)
        }
        rotarycraft {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// Legacy 1.7.10 sources in DragonAPI/ and RotaryCraft/ are intentionally not
// compiled by this modern build. They remain available as historical material.

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_group_id: mod_group_id,
        rotary_mod_id: rotary_mod_id,
        rotary_mod_name: rotary_mod_name
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("${project.projectDir}/repo")
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
