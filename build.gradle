plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

group = mod_group_id
version = mod_version

base {
    archivesName = 'Minecraft'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
}

dependencies {
    implementation 'org.classdump.luna:luna-all-shaded:0.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'opencomputers'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'opencomputers'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'opencomputers'
        }
        data {
            clientData()
            programArguments.addAll '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        opencomputers {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

var generateOpenComputersModMetadata = tasks.register('generateOpenComputersModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        opencomputers_mod_id: opencomputers_mod_id,
        opencomputers_mod_name: opencomputers_mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates-opencomputers'
    into 'build/generated/sources/opencomputersModMetadata'
}

sourceSets.main.resources.srcDir generateOpenComputersModMetadata
neoForge.ideSyncTask generateOpenComputersModMetadata

tasks.named('jar').configure {
    dependsOn generateOpenComputersModMetadata
    archiveFileName = 'Minecraft.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.output) {
        include 'de/xdarkixx/minecraft/opencomputers/**'
        include 'assets/opencomputers/**'
        include 'data/opencomputers/**'
        include 'opencomputers/**'
        include 'META-INF/neoforge.mods.toml'
    }

    from(configurations.runtimeClasspath.collect { zipTree(it) }) {
        include 'org/classdump/luna/**'
        exclude 'META-INF/**'
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("${project.projectDir}/repo")
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}