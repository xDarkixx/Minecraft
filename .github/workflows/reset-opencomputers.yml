name: Reset OpenComputers from upstream

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve modern OpenComputers port
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oc-modern
          for p in \
            build.gradle settings.gradle gradle.properties gradlew gradlew.bat \
            src/main/java/de/xdarkixx/minecraft/opencomputers \
            src/test/java/de/xdarkixx/minecraft/opencomputers \
            src/main/resources/assets/opencomputers \
            src/main/resources/data/opencomputers; do
            if [ -e "$p" ]; then
              mkdir -p "/tmp/oc-modern/$(dirname "$p")"
              cp -a "$p" "/tmp/oc-modern/$p"
            fi
          done

      - name: Reset repository and import exact upstream source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/upstream
          git clone --depth 1 --branch revert-3728-master-MC1.12 https://github.com/MightyPirates/OpenComputers.git /tmp/upstream
          git rm -r .
          mkdir -p OpenComputers/upstream-mc1.12
          cp -a /tmp/upstream/. OpenComputers/upstream-mc1.12/
          cp -a /tmp/oc-modern/. .
          rm -rf src/main/java/de/xdarkixx/minecraft/dragonapi \
                 src/main/java/de/xdarkixx/minecraft/rotarycraft \
                 src/test/java/de/xdarkixx/minecraft/dragonapi \
                 src/test/java/de/xdarkixx/minecraft/rotarycraft || true
          mkdir -p .github/workflows
          cat > .gitignore <<'EOF'
.gradle/
build/
out/
.idea/
*.iml
EOF
          cat > PORTING_STATUS.md <<'EOF'
# OpenComputers modern port

The original MightyPirates OpenComputers MC1.12 source is retained unchanged under `OpenComputers/upstream-mc1.12` as the reference implementation.

The active port targets Minecraft 26.2, the latest stable Minecraft Java release at this reset, with NeoForge 26.2.0.62 and Java 25.

Minecraft 26.3 is currently a pre-release, not a stable release, so it is not used as the production target.
EOF

      - name: Rebuild cleanly
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew || true
          ./gradlew --no-daemon clean build
          test -f build/libs/OpenComputers.jar
          jar tf build/libs/OpenComputers.jar | grep -q '^META-INF/neoforge.mods.toml$'
          jar tf build/libs/OpenComputers.jar | grep -q '^de/xdarkixx/minecraft/opencomputers/OpenComputersMod.class$'
          if jar tf build/libs/OpenComputers.jar | grep -Eq '(^|/)(dragonapi|rotarycraft|Reika)(/|$)'; then
            echo 'Unrelated DragonAPI/RotaryCraft content found in OpenComputers.jar'
            exit 1
          fi

      - name: Commit clean repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reset repository to OpenComputers upstream and modern port' || exit 0
          git push origin HEAD:main
