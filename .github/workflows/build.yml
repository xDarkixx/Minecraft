name: Build OpenComputers

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build and test OpenComputers
        run: gradle --no-daemon clean build

      - name: Verify distributable JAR
        shell: bash
        run: |
          test -f build/libs/OpenComputers.jar
          if jar tf build/libs/OpenComputers.jar | grep -Eq '^(de/xdarkixx/minecraft/(dragonapi|rotarycraft)/|Reika/)'; then
            echo 'Unrelated DragonAPI/RotaryCraft classes found in OpenComputers.jar'
            exit 1
          fi
          jar tf build/libs/OpenComputers.jar | grep -q '^de/xdarkixx/minecraft/opencomputers/OpenComputersMod.class$'
          jar tf build/libs/OpenComputers.jar | grep -q '^META-INF/neoforge.mods.toml$'

      - name: Dedicated server smoke test
        shell: bash
        run: |
          set +e
          timeout 180s gradle --no-daemon runServer 2>&1 | tee server.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo 'NeoForge server failed to start'
            exit "$status"
          fi
          grep -Eqi 'opencomputers' server.log

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: OpenComputers-Minecraft
          path: build/libs/OpenComputers.jar
          if-no-files-found: error

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencomputers-server-log
          path: server.log
          if-no-files-found: ignore
