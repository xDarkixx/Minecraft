name: Build OpenComputers

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean repository and import exact upstream reference
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f PORTING_STATUS.md ]; then
            echo 'Clean OpenComputers layout already exists.'
            exit 0
          fi

          mkdir -p /tmp/oc-modern
          cp -a build.gradle settings.gradle gradle.properties gradlew gradlew.bat /tmp/oc-modern/
          cp -a src /tmp/oc-modern/
          cp -a .github/workflows/build.yml /tmp/oc-modern/build.yml

          rm -rf /tmp/upstream
          git clone --depth 1 --branch revert-3728-master-MC1.12 https://github.com/MightyPirates/OpenComputers.git /tmp/upstream

          git rm -r .
          mkdir -p OpenComputers/upstream-mc1.12
          cp -a /tmp/upstream/. OpenComputers/upstream-mc1.12/

          cp -a /tmp/oc-modern/build.gradle /tmp/oc-modern/settings.gradle /tmp/oc-modern/gradle.properties /tmp/oc-modern/gradlew /tmp/oc-modern/gradlew.bat .
          cp -a /tmp/oc-modern/src .
          mkdir -p .github/workflows
          cp -a /tmp/oc-modern/build.yml .github/workflows/build.yml

          rm -f .github/workflows/reset-opencomputers.yml .github/workflows/import-opencomputers-mc1.12.yml
          rm -rf src/main/java/de/xdarkixx/minecraft/dragonapi src/main/java/de/xdarkixx/minecraft/rotarycraft src/test/java/de/xdarkixx/minecraft/dragonapi src/test/java/de/xdarkixx/minecraft/rotarycraft || true

          printf '%s\n' '.gradle/' 'build/' 'out/' '.idea/' '*.iml' > .gitignore
          printf '%s\n' '# OpenComputers modern port' '' 'The original MightyPirates OpenComputers MC1.12 source is retained unchanged under `OpenComputers/upstream-mc1.12` as the exact reference implementation.' '' 'Active target: Minecraft 26.2 (latest stable Java release), NeoForge 26.2.0.62, Java 25.' '' 'Minecraft 26.3 is currently a pre-release, so the stable target remains 26.2.' > PORTING_STATUS.md
          printf '%s\n' '# OpenComputers Community Port' '' 'Modern NeoForge port of OpenComputers for Minecraft 26.2.' '' 'The original MC1.12 source is retained unchanged under `OpenComputers/upstream-mc1.12` for exact comparison. The active port is under `src`.' > README.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reset repository to OpenComputers upstream and modern port'
          git push origin HEAD:main

      - name: Refresh workspace after clean reset
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build and test OpenComputers
        run: gradle --no-daemon clean build

      - name: Verify distributable JAR
        shell: bash
        run: |
          set -euo pipefail
          test -f build/libs/OpenComputers.jar
          jar tf build/libs/OpenComputers.jar | grep -q '^META-INF/neoforge.mods.toml$'
          jar tf build/libs/OpenComputers.jar | grep -q '^de/xdarkixx/minecraft/opencomputers/OpenComputersMod.class$'
          if jar tf build/libs/OpenComputers.jar | grep -Eq '(^|/)(dragonapi|rotarycraft|Reika)(/|$)'; then
            echo 'Unrelated DragonAPI/RotaryCraft content found in OpenComputers.jar'
            exit 1
          fi

      - name: Dedicated server smoke test
        shell: bash
        run: |
          set +e
          timeout 180s gradle --no-daemon runServer 2>&1 | tee server.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            echo 'NeoForge server failed to start'
            exit "$status"
          fi
          grep -Eqi 'opencomputers' server.log

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: OpenComputers-Minecraft
          path: build/libs/OpenComputers.jar
          if-no-files-found: error

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencomputers-server-log
          path: server.log
          if-no-files-found: ignore
